        .navbar-sticky {
            position: sticky;
            top: 0;

            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
        }

        .project-box {
            display: block;
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            transition: all 0.3s ease;
            background: #ffffff;
            border: 1px solid rgba(0,0,0,0.08);
            padding: 15px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            text-decoration: none;
        }

            .project-box img {
                width: 100%;
                height: 300px; 
                object-fit: contain; 
                transition: transform 0.5s ease;
                border-radius: 8px;
            }

            .project-box:hover {
                transform: translateY(-8px); 
                box-shadow: 0 15px 30px rgba(0,0,0,0.15);
                border-color: rgba(30, 48, 243, 0.3);
            }

                .project-box:hover img {
                    transform: scale(1.05); 
                }

        .project-box-caption {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(30, 48, 243, 0.9), rgba(255, 33, 113, 0.9));
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0; 
            transition: opacity 0.3s ease;
            border-radius: 15px; 
        }

        .project-box:hover .project-box-caption {
            opacity: 1; 
        }

        .project-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .project-desc {
            font-size: 0.9rem;
            font-weight: 300;
            opacity: 0.8;
        }
