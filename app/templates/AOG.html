    <style>
        .navbar-sticky {
            position: sticky;
            top: 0;
            z-index: 1030;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
        }

        .portfolio-box {
            display: block;
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            background: #f8f9fa; 
        }

            .portfolio-box img {
                width: 100%;
                height: 250px; 
                object-fit: cover; 
                transition: transform 0.5s ease;
            }

            .portfolio-box:hover {
                transform: translateY(-8px);
                box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            }

                .portfolio-box:hover img {
                    transform: scale(1.05);
                }

        .portfolio-box-caption {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(30, 48, 243, 0.85), rgba(255, 33, 113, 0.85));
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .portfolio-box:hover .portfolio-box-caption {
            opacity: 1;
        }

        .project-category {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 0.5rem;
        }

        .project-name {
            font-size: 1.5rem;
            font-weight: 700;
        }
    </style>
