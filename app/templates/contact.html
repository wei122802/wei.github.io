    <style>
        .navbar-sticky {
            position: sticky;
            top: 0;
            z-index: 1030;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
        }

        .contact-item {
            display: block;
            text-align: center;
            text-decoration: none;
            padding: 20px;
            transition: transform 0.3s ease;
            background: transparent;
            border: none;
            position: relative;
        }

        .img-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 20px auto;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .contact-icon-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.4s ease, transform 0.4s ease;
        }

        .app-icon-overlay {
            position: absolute;
            top: 22%;
            left: 22%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border-radius: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.4s ease;
        }

            .app-icon-overlay i {
                font-size: 2.5rem;
                background: linear-gradient(45deg, #1e30f3, #ff2171);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }

        .contact-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #212529;
            margin-bottom: 5px;
            transition: color 0.3s ease;
        }

        .contact-subtitle {
            font-size: 0.95rem;
            color: #6c757d;
            font-weight: 500;
        }

        .contact-item:hover .img-wrapper {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(30, 48, 243, 0.2);
        }

        .contact-item:hover .contact-icon-img {
            filter: blur(3px);
            transform: scale(1.1);
        }

        .contact-item:hover .app-icon-overlay {
            transform: translate(-50%, -50%) scale(1.2);
            background: rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .contact-item:hover .contact-title {
            background: linear-gradient(45deg, #1e30f3, #ff2171);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
